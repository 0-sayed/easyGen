name: PR Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|chore|docs|test|perf|ci|build|style|revert)(\([a-z0-9-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits."
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: GPL-3.0, AGPL-3.0

  merge-conflict:
    name: Merge Conflict Check
    runs-on: ubuntu-latest
    steps:
      - name: Check mergeability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in 1 2 3 4 5; do
            mergeable=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json mergeable --jq '.mergeable')
            if [[ "$mergeable" != "UNKNOWN" ]]; then
              break
            fi
            sleep 3
          done

          if [[ "$mergeable" == "CONFLICTING" ]]; then
            echo "Pull request has merge conflicts."
            exit 1
          fi

          if [[ "$mergeable" == "UNKNOWN" ]]; then
            echo "Pull request mergeability is still unknown."
            exit 1
          fi
